<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findings definition review</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
html{color-scheme:light}
:root{
  --bg:#ffffff; --side:#f7f7f5; --panel:#ffffff; --ink:#37352f; --ink2:rgba(55,53,47,.75); --ink3:rgba(55,53,47,.5);
  --line:rgba(55,53,47,.09); --line2:rgba(55,53,47,.06); --hover:rgba(55,53,47,.06); --sel:rgba(55,53,47,.08);
  --accent:#2383e2; --accent-soft:rgba(35,131,226,.1);
  --inc:#448361; --inc-soft:#edf3ec; --exc:#c4554d; --exc-soft:#fdebec;
  --warn:#cb912f; --warn-soft:#fbf3db; --done:#787774; --done-soft:#f1f1ef; --purple:#9065b0; --purple-soft:#f6f3f9;
  --focus:rgba(35,131,226,.35);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji";
  --mono:"SFMono-Regular",Menlo,Consolas,"PT Mono","Liberation Mono",Courier,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;height:45px;background:var(--bg)}
header h1{font:500 14px/1.2 var(--sans);margin:0;color:var(--ink)}
header .sub{display:none}
header .spacer{flex:1}
.who{font-size:13px;color:var(--ink3);text-align:right;line-height:1.3}
.who b{color:var(--ink2);font-weight:500}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:transparent;padding:4px 9px;border-radius:4px;font-size:14px;color:var(--ink3)}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--ink);background:var(--sel)}
.banner{padding:8px 16px;font-size:14px;display:none}
.banner.show{display:block}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}

.body{display:grid;grid-template-columns:260px 1fr;min-height:0}
nav{background:var(--bg);overflow:auto;padding:10px 8px 40px;border-right:1px solid var(--line2)}
.search{width:100%;padding:5px 8px;border:0;border-radius:4px;background:var(--hover);margin-bottom:6px;font-size:14px;outline:0}
.search:focus{box-shadow:0 0 0 2px var(--focus)}
.navfilters{display:flex;gap:10px;margin:2px 6px 10px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.navfilters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.cat{margin-bottom:1px}
.cat>button{width:100%;display:flex;align-items:center;gap:6px;border:0;background:transparent;text-align:left;padding:3px 8px;border-radius:4px;font-size:14px;color:var(--ink2);font-weight:500;min-height:28px}
.cat>button::before{content:"›";display:inline-block;width:12px;color:var(--ink3);transition:transform .12s}
.cat.on>button::before,.searching .cat>button::before{transform:rotate(90deg)}
.cat>button:hover{background:var(--hover)}
.cat.on>button{background:var(--sel);color:var(--ink)}
.cat .nm{flex:1}
.cnt{font-size:12px;color:var(--ink3)}
.badge{font-size:11.5px;background:var(--warn-soft);color:var(--ink);padding:0 6px;border-radius:3px;line-height:18px}
.qlist{margin:1px 0 4px 0;display:none}
.cat.on .qlist,.searching .qlist{display:block}
.qlist a{display:flex;gap:6px;align-items:center;padding:2px 8px 2px 24px;font-size:13.5px;color:var(--ink3);text-decoration:none;border-radius:4px;min-height:26px}
.qlist a:hover{background:var(--hover);color:var(--ink2)}
.qlist a .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist a .ck{color:var(--inc);font-size:11px;width:10px}

main{overflow:auto;padding:48px 64px 140px}
.wrap{max-width:860px;margin:0 auto}
.cathead{margin:0 0 28px}
.cathead h2{font:700 40px/1.2 var(--sans);margin:0 0 6px;color:var(--ink)}
.cathead p{margin:0;color:var(--ink3);font-size:15px}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;background:var(--purple-soft);color:var(--purple);line-height:20px;vertical-align:middle}

.card{border-top:1px solid var(--line);padding:22px 0 8px;margin:0;scroll-margin-top:12px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.chead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.chead .qq{flex:1}
.chead h3{font:600 20px/1.3 var(--sans);margin:0 0 2px}
.qid{font:12.5px var(--mono);color:var(--exc);background:var(--hover);display:inline-block;padding:0 5px;border-radius:3px}
.qid a{color:inherit;text-decoration:none}
.variants{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink3)}
.variants li{padding-left:14px;position:relative}
.variants li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.addbtn{border:0;background:transparent;padding:4px 8px;border-radius:4px;font-size:14px;color:var(--ink3);white-space:nowrap}
.addbtn:hover{background:var(--hover);color:var(--ink2)}
.defs{padding:2px 0}
.sent{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;padding:4px 4px;border-radius:4px;align-items:start}
.sent:hover{background:var(--hover)}
.lab{font-size:14px;color:var(--ink3);padding:1px 0;display:flex;align-items:center;gap:6px}
.lab::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--done-soft);flex:none}
.lab.Includes::before{background:var(--inc)} .lab.Excludes::before{background:var(--exc)} .lab.mixed::before{background:var(--warn)} .lab.Definition::before{background:var(--accent)}
.stext{font-size:15px;line-height:1.6}
.flag{opacity:0;border:0;background:transparent;color:var(--ink3);padding:3px;border-radius:4px;line-height:0}
.sent:hover .flag,.flag:focus{opacity:1}
.flag:hover{color:var(--ink);background:var(--sel)}
.sent.has{background:var(--warn-soft)}
.sent.has .flag{opacity:1;color:var(--warn)}
.terms{padding:2px 0 6px}
.trow{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding-top:1px}
.chip{font-size:13px;padding:0 6px;border-radius:3px;background:var(--inc-soft);color:var(--ink);line-height:21px}
.chip.x{background:var(--exc-soft)}
.sev{font-size:15px;color:var(--ink2)}
.foot{padding:6px 4px 10px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink3);flex-wrap:wrap}
.revbtn{border:1px solid var(--line);background:transparent;padding:1px 8px;border-radius:4px;font-size:13px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.revbtn::before{content:"";width:12px;height:12px;border:1.5px solid var(--ink3);border-radius:3px}
.revbtn:hover{background:var(--hover)}
.revbtn.on{color:var(--ink)}
.revbtn.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--bg)}
.pocus{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding:2px 0 4px}
.pocus .pq{color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:1px 10px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent);color:#fff}
.pnoterow{display:flex;gap:8px;align-items:center;width:100%}
.pnote{flex:1;max-width:520px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--hover);font-size:13.5px}
.pnote:disabled{opacity:.55;cursor:not-allowed}
.preasons{margin:0;padding:0 0 0 2px;list-style:none;width:100%;font-size:13px;color:var(--ink2)}
.preasons li{padding:1px 0}
@media (max-width:520px){ .seg{width:100%} .seg button{flex:1;padding:2px 4px;font-size:12px;line-height:1.25} }
.notes:empty{display:none}
.notes{margin:6px 0 4px;padding:4px 14px 4px 14px;background:var(--side);border-radius:4px}
.note{padding:10px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note.resolved .ntext,.note.resolved .sugg,.note.resolved .tgt{opacity:.55}
.nmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-bottom:3px}
.ty{font-size:12px;padding:0 6px;border-radius:3px;background:var(--warn-soft);color:var(--ink);line-height:20px}
.st{font-size:12px;padding:0 6px;border-radius:3px;line-height:20px;display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.open{background:var(--accent-soft);color:var(--accent)} .st.resolved{background:var(--done-soft);color:var(--done)}
.auth{color:var(--ink);font-weight:500}
.tgt{font-size:13.5px;color:var(--ink2);margin:2px 0 6px;border-left:3px solid var(--ink);padding:0 0 0 12px}
.ntext{white-space:pre-wrap;font-size:15px}
.sugg{margin-top:8px;padding:10px 12px;background:var(--inc-soft);border-radius:4px;font-size:14.5px;white-space:pre-wrap;display:flex;gap:10px}
.sugg::before{content:"💡"}
.sugg b{font-weight:600;display:block;margin-bottom:2px}
.nact{display:flex;gap:4px;margin-top:4px;margin-left:-6px}
.nact button{border:0;background:transparent;padding:1px 6px;border-radius:4px;font-size:13px;color:var(--ink3)}
.nact button:hover{background:var(--hover);color:var(--ink2)}
.nact button.danger:hover,.nact button.arm{color:var(--exc)}
.replies{margin:8px 0 0 4px;padding-left:14px;border-left:2px solid var(--line)}
.replies .note{padding:6px 0}

.formslot:empty{display:none}
.form{margin:8px 0;padding:14px 16px;border-radius:6px;box-shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;background:var(--panel)}
.form h4{margin:0 0 12px;font-size:14px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form label{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px}
.form select,.form textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--hover);font-size:14px}
.form textarea{resize:vertical;min-height:72px}
.form .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{border:1px solid var(--line);background:transparent;padding:4px 12px;border-radius:4px;font-size:14px;color:var(--ink2)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(.95)}
.btn.pri:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--ink3)}

.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-weight:400;font-size:13.5px;color:var(--ink3);padding:7px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.table th+th,.table td+td{border-left:1px solid var(--line)}
.table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:hover td{background:var(--line2)}
.table td.n{max-width:340px;white-space:pre-wrap}
.table tr.reply td:first-child{padding-left:22px}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools select{padding:3px 6px;border:0;border-radius:4px;background:var(--hover);font-size:13.5px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 24px}
.stat{background:var(--side);border-radius:4px;padding:12px 14px}
.stat b{display:block;font:600 24px/1.2 var(--sans)}
.stat span{font-size:13px;color:var(--ink3)}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.copybox{width:100%;height:120px;margin-top:8px;font:12px var(--mono)}
@media (max-width:820px){
  .body{grid-template-columns:1fr}
  nav{display:none}
  .body.navopen nav{display:block;position:fixed;inset:90px 0 0 0;z-index:5}
  .sent,.trow{grid-template-columns:1fr 28px}
  .lab{grid-column:1/-1;padding:0}
  .navtoggle{display:inline-block!important}
  main{padding:24px 16px 100px}
  header{flex-wrap:wrap;height:auto}
  .cathead h2{font-size:30px}
}
.navtoggle{display:none}
.sent.title{grid-template-columns:1fr 28px;padding:2px 4px;margin:0 -4px}
.chead .qid{margin-left:0}
.stext.var{color:var(--ink2)}
.lab.Variant::before{background:var(--purple)}
.lab:empty::before{display:none}
.chip{border:0;cursor:pointer;font-family:inherit}
.chip:hover{box-shadow:0 0 0 1px var(--ink3) inset}
.chip.has{box-shadow:0 0 0 1.5px var(--warn) inset}
.sent.active,.chip.active{box-shadow:0 0 0 2px var(--accent) inset}
.ctx{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ctxl{font-size:12px;color:var(--ink3)}
.ctxq{font-size:14px;color:var(--ink2);border-left:3px solid var(--ink);padding-left:10px}
.form select{max-width:320px}
</style>
<style>
.modal-bg{position:fixed;inset:0;background:rgba(15,15,15,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:20}
.modal{background:var(--bg);border-radius:8px;width:min(420px,92vw);padding:26px 26px 22px;box-shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 5px 10px,rgba(15,15,15,.2) 0 15px 40px}
.modal h2{margin:0 0 6px;font-size:20px;font-weight:600}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14px}
.modal input[type=email],.modal input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--hover);font-size:15px;margin-bottom:10px}
.modal .wide{width:100%;padding:8px 12px;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.modal .or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;margin:14px 0}
.modal .or::before,.modal .or::after{content:"";flex:1;height:1px;background:var(--line)}
.modal .msg{font-size:13.5px;margin-top:10px;color:var(--ink2)}
.modal .msg.err{color:var(--exc)}
.linkbtn{border:0;background:transparent;color:var(--ink3);font-size:13px;padding:2px 4px;border-radius:4px}
.linkbtn:hover{background:var(--hover);color:var(--ink2)}
.banner .btn{margin-left:10px;padding:2px 10px;font-size:13px;background:var(--bg)}
.admin{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
.admin h3{font-size:16px;margin:0 0 4px}
.admin form{display:flex;gap:6px;margin:12px 0}
.admin input[type=email]{flex:1;max-width:340px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--hover)}
.admin ul{list-style:none;margin:0;padding:0;max-width:560px}
.admin li{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
.admin li span.e{flex:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js?v=3"></script>
</head>
<body>
<div class="app">
  <header>
    <button class="btn navtoggle" id="navtoggle" aria-label="Show categories">☰</button>
    <img src="logo.png" alt="" width="26" height="26" style="flex:none">
    <h1 id="title">Findings definition review</h1>
    <div class="spacer"></div>
    <div class="tabs" role="tablist">
      <button id="tab-browse" class="on">Browse</button>
      <button id="tab-notes">All notes <span class="cnt" id="notecount"></span></button>
    </div>
    <div class="who" id="who"></div>
  </header>
  <div class="banner" id="banner"></div>
  <div class="body" id="body">
    <nav id="nav"></nav>
    <main id="main"><div class="wrap" id="wrap"><div class="empty">Loading findings…</div></div></main>
  </div>
</div>
<div id="modal"></div>
<script src="app.js?v=3"></script>
</body>
</html>
